name: Deploy microsite to GitHub Pages

on:
  push:
    branches: ["claude/practical-pasteur-ughtn4"]
  workflow_dispatch:

# Allow this workflow to enable Pages and publish to it.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel stale ones.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
